<!DOCTYPE html>
<html>
<head><title>Dukaan Billing</title></head>
<body style="font-family:Arial; padding:20px;">
<h2>🛒 Meri Dukaan Billing - Day 3 Web</h2>
<h3>Aaj ki Sale: Rs. {{ today_sale }}</h3>
<hr>
<h3>Bill Banao</h3>
<form action="/bill" method="POST">
  Item: <select name="item_id">
    {% for i in items %}
      <option value="{{ i[0] }}">{{ i[1] }} - Rs.{{ i[2] }} (Stock:{{ i[3] }})</option>
    {% endfor %}
  </select>
  <br><br>
  Qty: <input type="number" name="qty" value="1" required>
  <br><br>
  <button type="submit" style="padding:10px 20px; background:green; color:white;">Bill Banao</button>
</form>
</body>
</html>
